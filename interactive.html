<!DOCTYPE html>

<head>

  <meta property="og:url" content="" id="og-url" />
  <meta property="og:image" content="" id="og-image" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PRISMA — Formato Interactivo" id="tw-title" />
  <meta name="twitter:description" content="Contenido interactivo en PRISMA" id="tw-desc" />
  <meta name="twitter:image" content="" id="tw-image" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/favicon.png?v=1" />
  <link rel="apple-touch-icon" href="assets/logo.png?v=1" />

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/styles.css?v=11" />
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Tailwind CSS (Scoped for Interactive Content) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          colors: {
            primary: 'var(--primary)',
            secondary: 'var(--secondary)',
            tertiary: 'var(--tertiary)',
            surface: 'var(--surface)',
            'surface-dim': 'var(--surface-dim)',
            outline: 'var(--outline)',
            stone: {
              50: '#fafaf9',
              100: '#f5f5f4',
              200: '#e7e5e4',
              300: '#d6d3d1',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
            },
            amber: {
              50: '#451a03',
              100: '#78350f',
              200: '#92400e',
              300: '#b45309',
              400: '#d97706',
              500: '#f59e0b',
              600: '#fbbf24',
              700: '#fcd34d',
              800: '#fde68a',
              900: '#fffbeb',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .tw-content-area img { @apply max-w-full h-auto rounded-lg; }
      .tw-content-area ul { @apply list-disc list-inside space-y-2; }
      .tw-content-area ol { @apply list-decimal list-inside space-y-2; }
      .tw-content-area p { @apply mb-4; }
      /* Ensure links are visible */
      .tw-content-area a { @apply text-primary hover:underline; }
    }
  </style>
</head>
<body data-page="interactive">

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">PRISMA</a>
      <nav class="nav-desktop">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Inicio</a>
        <a href="topics.html" class="nav-link" data-i18n="nav_topics">Temas</a>
        <a href="#" class="nav-link" data-i18n="nav_archive">Archivo</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="es">ES</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <div class="search-container" id="search-container">
          <button class="icon-btn" id="search-btn" aria-label="Search">
            <span class="material-symbols-outlined">search</span>
          </button>
          <input type="search" id="search-input" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="Buscar artículos..." autocomplete="off" />
        </div>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Nav -->
  <nav class="nav-mobile" id="nav-mobile">
    <a href="index.html" class="nav-link" data-i18n="nav_home">Inicio</a>
    <a href="topics.html" class="nav-link" data-i18n="nav_topics">Temas</a>
    <a href="#" class="nav-link" data-i18n="nav_archive">Archivo</a>
  </nav>

  <!-- Interactive Dashboard Layout -->
  <div class="interactive-layout" style="height: calc(100vh - var(--header-height));">
    
    <!-- Sidebar (Desktop) -->
    <aside class="interactive-sidebar">
      <div class="interactive-sidebar-header">
        <h1 class="interactive-logo">PRISMA</h1>
        <p class="interactive-subtitle" id="interactive-subtitle">Cargando...</p>
      </div>
      <nav class="interactive-nav" id="desktop-nav">
        <!-- Generado dinámicamente -->
      </nav>
      <div class="interactive-sidebar-footer">
        <a href="index.html" class="interactive-back-btn" id="btn-back">
          <span class="material-symbols-outlined">arrow_back</span>
          <span data-i18n="back_to_article">Volver al Artículo</span>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="interactive-main">
      
      <!-- Mobile Header -->
      <header class="interactive-mobile-header">
        <h1 class="interactive-mobile-logo">PRISMA</h1>
        <div class="interactive-mobile-controls">
          <select id="mobile-nav" class="interactive-mobile-select">
            <!-- Generado dinámicamente -->
          </select>
        </div>
      </header>

      <!-- Content Container -->
      <main class="interactive-content" id="interactive-content">
        <!-- Sections generated dynamically -->
      </main>

    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-logo">PRISMA</div>
      <div class="footer-links">
        <a href="mailto:info@prisma.tech" data-i18n="footer_contact">Contact</a>
        <span class="footer-divider">|</span>
        <span data-i18n="footer_designed_by">Designed by</span>
        <a href="https://alpepaslabs.com" target="_blank" class="labs-link" data-i18n="footer_labs">Alpepas Labs</a>
      </div>
      <div class="footer-copyright" data-i18n="footer_copyright">© 2025 PRISMA. Todos los derechos reservados.</div>
    </div>
  </footer>

  <!-- Core Scripts -->
  <script src="js/i18n.js?v=8"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
