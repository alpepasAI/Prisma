<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">PRISMA — Explorador de Temas</title>
  <meta name="description" content="Explora artículos por tema y busca contenido en PRISMA." id="meta-desc" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PRISMA — Explorador de Temas" id="og-title" />
  <meta property="og:description" content="Explora artículos por tema y busca contenido en PRISMA." id="og-desc" />
  <meta property="og:url" content="" id="og-url" />
  <meta property="og:image" content="" id="og-image" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PRISMA — Explorador de Temas" id="tw-title" />
  <meta name="twitter:description" content="Explora artículos por tema y busca contenido en PRISMA." id="tw-desc" />
  <meta name="twitter:image" content="" id="tw-image" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/favicon.png?v=1" />
  <link rel="apple-touch-icon" href="assets/logo.png?v=1" />

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/styles.css?v=10" />
</head>
<body data-page="topics">

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">PRISMA</a>
      
      <nav class="nav-desktop">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Inicio</a>
        <a href="topics.html" class="nav-link active" data-i18n="nav_topics">Temas</a>
        <a href="#" class="nav-link" data-i18n="nav_archive">Archivo</a>
      </nav>

      <div class="header-actions">
        <!-- Language Switcher -->
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="es">ES</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        
        <!-- Search -->
        <div class="search-container" id="search-container">
          <button class="icon-btn" id="search-btn" aria-label="Search">
            <span class="material-symbols-outlined">search</span>
          </button>
          <input type="search" id="search-input" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="Buscar artículos..." autocomplete="off" />
        </div>

        <!-- Hamburger (mobile) -->
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Nav -->
  <nav class="nav-mobile" id="nav-mobile">
    <a href="index.html" class="nav-link" data-i18n="nav_home">Inicio</a>
    <a href="topics.html" class="nav-link active" data-i18n="nav_topics">Temas</a>
    <a href="#" class="nav-link" data-i18n="nav_archive">Archivo</a>
  </nav>

  <!-- Main Content -->
  <main class="site-main">
    <div class="topics-header">
      <h1 class="topics-title" data-i18n="topics_title">Explorador de Temas</h1>
      <p class="topics-subtitle" data-i18n="topics_subtitle">Selecciona uno o más temas para filtrar la biblioteca de conocimiento.</p>
      
      <div class="topics-filter-tags" id="topics-filter-tags">
        <!-- Tags will be rendered here dynamically -->
      </div>

      <div class="topics-logic-toggle" id="topics-logic-toggle">
        <span class="logic-label active" id="logic-or" data-i18n="logic_or">Cualquiera</span>
        <label class="toggle-switch">
          <input type="checkbox" id="logic-checkbox" aria-label="Toggle AND/OR logic">
          <span class="toggle-slider"></span>
        </label>
        <span class="logic-label" id="logic-and" data-i18n="logic_and">Todos</span>
      </div>
    </div>

    <div class="topics-results">
      <div class="topics-results-header">
        <span class="topics-results-count" id="topics-results-count">0 <span data-i18n="topics_articles_count">artículos</span></span>
      </div>
      
      <!-- Reusing the chronological log container structure for consistency -->
      <div class="chronological-log" id="topics-results-list">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner" style="flex-direction: row; justify-content: space-between; align-items: center; gap: var(--space-md);">
      <div class="footer-copyright" data-i18n="footer_copyright">© 2025 PRISMA. Todos los derechos reservados.</div>
      <div class="footer-links">
        <a href="mailto:info@prisma.tech" data-i18n="footer_contact">Contacto</a>
        <span class="footer-divider">|</span>
        <span data-i18n="footer_designed_by">Diseñado por</span>
        <a href="https://alpepaslabs.com" target="_blank" class="labs-link" data-i18n="footer_labs">Alpepas Labs</a>
      </div>
      <div style="font-size: 0.7rem; color: var(--primary); opacity: 0.6; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600;" data-i18n="powered_by">Potenciado por Gemini & NotebookLM</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/i18n.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
