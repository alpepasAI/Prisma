<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">PRISMA — Explorador de Temas</title>
  <meta name="description" content="Explora artículos por tema y busca contenido en PRISMA." id="meta-desc" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PRISMA — Explorador de Temas" id="og-title" />
  <meta property="og:description" content="Explora artículos por tema y busca contenido en PRISMA." id="og-desc" />
  <meta property="og:url" content="https://prisma.alpepaslabs.com/topics.html" id="og-url" />
  <meta property="og:image" content="https://prisma.alpepaslabs.com/assets/logo.png" id="og-image" />
  <link rel="canonical" href="https://prisma.alpepaslabs.com/topics.html" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PRISMA — Explorador de Temas" id="tw-title" />
  <meta name="twitter:description" content="Explora artículos por tema y busca contenido en PRISMA." id="tw-desc" />
  <meta name="twitter:image" content="https://prisma.alpepaslabs.com/assets/logo.png" id="tw-image" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/favicon.png?v=1" />
  <link rel="apple-touch-icon" href="assets/logo.png?v=1" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0c10" />

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/styles.css?v=31" />
</head>
<body data-page="topics">

  <div id="app-header"></div>

  <!-- Mobile Nav -->
  <nav class="nav-mobile" id="nav-mobile">
    <a href="./" class="nav-link" data-i18n="nav_home">Inicio</a>
    <a href="topics.html" class="nav-link active" data-i18n="nav_topics">Temas</a>
    <!-- Archive hidden until section is ready
    <a href="#" class="nav-link" data-i18n="nav_archive">Archivo</a>
    -->
  </nav>

  <!-- Main Content -->
  <main class="site-main">
    <div class="topics-header">
      <h1 class="topics-title" data-i18n="topics_title">Explorador de Temas</h1>
      <p class="topics-subtitle" data-i18n="topics_subtitle">Selecciona uno o más temas para filtrar la biblioteca de conocimiento.</p>
      
      <div class="topics-filter-tags" id="topics-filter-tags">
        <!-- Tags will be rendered here dynamically -->
      </div>

      <div class="topics-logic-toggle" id="topics-logic-toggle">
        <span class="logic-label active" id="logic-or" data-i18n="logic_or">Cualquiera</span>
        <label class="toggle-switch">
          <input type="checkbox" id="logic-checkbox" aria-label="Toggle AND/OR logic">
          <span class="toggle-slider"></span>
        </label>
        <span class="logic-label" id="logic-and" data-i18n="logic_and">Todos</span>
      </div>

      <!-- Date range filter -->
      <div class="topics-date-filter" id="topics-date-filter">
        <span class="date-filter-label" data-i18n="date_filter_label">Período:</span>
        <div class="date-range-inputs">
          <!-- Hidden inputs (functional, not visible) -->
          <input type="month" id="date-from" class="date-picker-hidden" aria-hidden="true" tabindex="-1">
          <input type="month" id="date-to"   class="date-picker-hidden" aria-hidden="true" tabindex="-1">
          <!-- Custom trigger buttons (visible UI) -->
          <button class="date-picker-btn" id="date-from-btn" type="button" aria-label="Seleccionar mes inicial">
            <span class="material-symbols-outlined">calendar_month</span>
            <span id="date-from-label" data-i18n="date_from_placeholder">Desde</span>
          </button>
          <span class="date-range-sep" aria-hidden="true">→</span>
          <button class="date-picker-btn" id="date-to-btn" type="button" aria-label="Seleccionar mes final">
            <span class="material-symbols-outlined">calendar_month</span>
            <span id="date-to-label" data-i18n="date_to_placeholder">Hasta</span>
          </button>
          <button class="date-range-clear" id="date-range-clear" aria-label="Limpiar rango de fechas" title="Limpiar fechas">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
    </div>

    <div class="topics-results">
      <div class="topics-results-header">
        <span class="topics-results-count" id="topics-results-count">0 <span data-i18n="topics_articles_count">artículos</span></span>
      </div>
      
      <!-- Reusing the chronological log container structure for consistency -->
      <div class="chronological-log" id="topics-results-list">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <!-- Scripts -->
  <script src="js/sw-register.js?v=31"></script>
  <script src="js/i18n.js?v=31"></script>
  <script type="module" src="js/app.js?v=31"></script>
</body>
</html>
