  <meta name="twitter:image" content="https://prisma.alpepaslabs.com/assets/logo.png" id="tw-image" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/favicon.png?v=1" />
  <link rel="apple-touch-icon" href="assets/logo.png?v=1" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0c10" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css?v=22" />
</head>
<body data-page="home">

  <div id="app-header"></div>

  <!-- Mission Section -->
  <section class="site-main" style="padding-bottom: 0;">
    <div class="glass-panel" style="padding: var(--space-xl); border-radius: var(--radius-xl); border: 1px solid rgba(61, 73, 76, 0.2); text-align: center;">
      <h2 class="section-title" style="justify-content: center; border: none; margin-bottom: var(--space-sm);">
        <span class="material-symbols-outlined">rocket_launch</span>
        <span data-i18n="mission_title">Nuestra Misión</span>
      </h2>
      <p style="color: var(--on-surface-variant); max-width: 800px; margin: 0 auto; line-height: 1.8; font-size: 0.9375rem;" data-i18n="mission_text">
        Este blog nace del deseo de compartir temas de vanguardia sobre IA y programación...
      </p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="site-main">
    <!-- Hero: Featured Article -->
    <section class="hero" id="hero-section" aria-label="Featured Article">
      <!-- Skeleton shown until JS renders content -->
      <div class="skeleton-hero" id="hero-skeleton">
        <div class="skeleton skeleton-tag"></div>
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-title-2"></div>
        <div class="skeleton skeleton-summary"></div>
        <div class="skeleton skeleton-summary-2"></div>
        <div class="skeleton skeleton-button"></div>
        <div class="skeleton-formats">
          <div class="skeleton skeleton-format-card"></div>
          <div class="skeleton skeleton-format-card"></div>
          <div class="skeleton skeleton-format-card"></div>
          <div class="skeleton skeleton-format-card"></div>
        </div>
      </div>
    </section>

    <!-- Chronological Log -->
    <section class="chrono-log" aria-label="Article List">
      <h2 class="section-title">
        <span class="material-symbols-outlined">history</span>
        <span data-i18n="section_chronolog">Registro Cronológico</span>
      </h2>
      <div id="chrono-log-list">
        <!-- Skeleton entries -->
        <div class="skeleton-entry" id="chrono-skeleton">
          <div class="skeleton skeleton-meta"></div>
          <div class="skeleton skeleton-h3"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line-2"></div>
        </div>
        <div class="skeleton-entry">
          <div class="skeleton skeleton-meta"></div>
          <div class="skeleton skeleton-h3" style="width:55%"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line-2" style="width:65%"></div>
        </div>
        <div class="skeleton-entry">
          <div class="skeleton skeleton-meta"></div>
          <div class="skeleton skeleton-h3" style="width:65%"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line-2" style="width:50%"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <!-- Scripts -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW error', err));
      });
    }
  </script>
  <script src="js/i18n.js?v=22"></script>
  <script type="module" src="js/app.js?v=22"></script>
</body>
</html>
